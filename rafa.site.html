<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafaa ganteng</title>
<style>
  :root { --bg: #000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* 21st.dev / Aceternity-style spotlight that follows the cursor */
  .spotlight {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(420px circle at var(--x, 50%) var(--y, 50%),
                rgba(255,255,255,.08), transparent 70%);
  }

  h1 {
    font-size: clamp(2.6rem, 10vw, 7rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    text-align: center;
    padding: 0 1rem;
    line-height: 1.05;
  }

  /* ReactBits "Shiny Text": a light sweep moving across the text */
  .shiny {
    display: inline-block;
    color: #8a8a8a;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%);
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    animation: shine 3s linear infinite;
    animation-delay: 1.4s;
  }
  @keyframes shine {
    from { background-position: 100% 0; }
    to   { background-position: -100% 0; }
  }

  /* ReactBits "Blur Text": each letter fades in from a blur */
  .char {
    display: inline-block;
    opacity: 0;
    filter: blur(14px);
    transform: translateY(24px);
    animation: blurIn .9s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: calc(var(--i) * 70ms);
  }
  .space { width: .3em; }
  @keyframes blurIn {
    to { opacity: 1; filter: blur(0); transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .char { animation: none; opacity: 1; filter: none; transform: none; }
    .shiny { animation: none; color: #fff; background: none; }
  }
</style>
</head>
<body>
  <div class="spotlight" aria-hidden="true"></div>
  <h1 aria-label="Rafaa ganteng"><span class="shiny" id="text"></span></h1>

<script>
  // Split the text into letters for the blur-in effect
  const target = document.getElementById("text");
  [..."Rafaa ganteng"].forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = ch === " " ? "char space" : "char";
    s.style.setProperty("--i", i);
    s.textContent = ch === " " ? "\u00A0" : ch;
    s.setAttribute("aria-hidden", "true");
    target.appendChild(s);
  });

  // Spotlight follows the pointer
  const root = document.documentElement;
  addEventListener("pointermove", e => {
    root.style.setProperty("--x", e.clientX + "px");
    root.style.setProperty("--y", e.clientY + "px");
  });
</script>
</body>
</html>
